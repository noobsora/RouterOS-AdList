name: Generate ROS Adlist

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: 🧪 Run generate_adlist.py
        run: python generate_adlist.py

      - name: 📤 Commit and push if changed
        env:
          TZ: Asia/Hong_Kong
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add ros-adlist.txt
          
          if git diff --staged --quiet; then
            echo "No changes detected in ros-adlist.txt. Skipping commit."
          else
            DATE=$(date '+%Y-%m-%d %H:%M GMT+8')
            git commit -m "🤖 更新 ros-adlist.txt ($DATE)"
            git push
            echo "Changes committed and pushed successfully."
          fi
